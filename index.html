<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="学习打卡追踪器 —— 记录每天的学习内容与时长">
  <title>学习打卡 · Study Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- ==================== 顶部 ==================== -->
  <header class="app-header">
    <div class="header-row">
      <h1 class="app-title">学习打卡</h1>
      <span class="pill" id="today-pill">从今天开始</span>
    </div>
    <p class="app-meta" id="app-meta">—</p>
  </header>

  <!-- ==================== 主体 ====================
       手机 / 平板：.app-body 是普通块，两栏上下堆叠
       桌面（≥800px）：.app-body 变成两栏栅格
         · 左栏 = 输入侧（今日概览 / 统计 / 表单）
         · 右栏 = 输出侧（打卡列表）
       两个 col 容器本身没有样式，只是分栏用的钩子。
       ============================================ -->
  <div class="app-body">

    <!-- ---------- 左栏 ---------- -->
    <div class="col-left">

      <!-- 今日卡片 -->
      <section class="hero-card">
        <p class="hero-label">今日学习</p>
        <p class="hero-subject">学习时长</p>
        <p class="hero-number">
          <span id="stat-today-minutes">0</span><span class="hero-unit">分钟</span>
        </p>
        <p class="hero-note" id="hero-note">今天还没有记录</p>
        <button type="button" class="hero-btn" id="jump-to-form">记一笔 →</button>
      </section>

      <!-- 统计 -->
      <section class="section">
        <h2 class="section-title">我的记录<span class="section-extra" id="record-count">0 条</span></h2>

        <div class="card stat-card">
          <div class="stat-main">
            <p class="stat-number"><span id="stat-total">0</span><span class="stat-unit">条</span></p>
            <p class="stat-caption">已记录的打卡</p>
          </div>

          <div class="stat-grid">
            <div class="stat-cell">
              <b id="stat-streak">0</b>
              <span>连续天数</span>
            </div>
            <div class="stat-cell">
              <b id="stat-minutes">0</b>
              <span>总分钟</span>
            </div>
            <div class="stat-cell">
              <b id="stat-days">0</b>
              <span>打卡天数</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 添加记录 -->
      <section class="section" id="form-section">
        <h2 class="section-title">添加记录</h2>

        <form class="card form-card" id="record-form">
          <div class="field">
            <label for="input-date">日期</label>
            <input type="date" id="input-date" required>
          </div>

          <div class="field">
            <label for="input-content">学习了什么</label>
            <input type="text" id="input-content" placeholder="例如：CSS Flex 布局" required>
          </div>

          <div class="field">
            <label for="input-duration">时长（分钟）</label>
            <input type="number" id="input-duration" min="1" max="1440" placeholder="45" required>
          </div>

          <button type="submit" class="btn-primary">添加</button>
          <p class="form-error" id="form-error" hidden></p>
        </form>
      </section>

    </div>

    <!-- ---------- 右栏 ---------- -->
    <div class="col-right">

      <!-- 记录列表 -->
      <section class="section">
        <h2 class="section-title">最近打卡</h2>

        <ul class="record-list" id="record-list"></ul>
        <p class="empty-hint" id="empty-hint">还没有记录，从左边添加第一条吧。</p>
      </section>

    </div>

  </div>

  <footer class="app-footer">
    <p>学习打卡追踪器 · 纯 HTML / CSS / JavaScript 手写</p>
  </footer>

</div>

<script src="js/app.js"></script>
</body>
</html>
